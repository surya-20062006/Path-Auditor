version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dpa_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: enterprise_password_2026
      POSTGRES_DB: decision_path_auditor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d decision_path_auditor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audit_network

  redis:
    image: redis:7-alpine
    container_name: dpa_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audit_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dpa_backend
    restart: always
    environment:
      - APP_NAME="Decision Path Auditor API"
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://admin:enterprise_password_2026@postgres:5432/decision_path_auditor
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - PII_ENCRYPTION_KEY=01234567890123456789012345678901
      - JWT_SECRET_KEY=enterprise_super_secret_jwt_key_2026
      - ENABLE_S3_ARCHIVAL=false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audit_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dpa_celery_worker
    restart: always
    command: ["celery", "-A", "backend.core.celery_app:celery_app", "worker", "--loglevel=info", "-c", "4"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://admin:enterprise_password_2026@postgres:5432/decision_path_auditor
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - PII_ENCRYPTION_KEY=01234567890123456789012345678901
    depends_on:
      - backend
      - redis
    networks:
      - audit_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dpa_frontend
    restart: always
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "8501:8501"
      - "3000:8501"
    depends_on:
      - backend
    networks:
      - audit_network

  prometheus:
    image: prom/prometheus:latest
    container_name: dpa_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - audit_network

  grafana:
    image: grafana/grafana:latest
    container_name: dpa_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - audit_network

volumes:
  postgres_data:

networks:
  audit_network:
    driver: bridge
